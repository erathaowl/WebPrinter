services:
  webprinter:
    image: ghcr.io/erathaowl/webprinter:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: webprinter
    hostname: webprinter
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      PRINTER_NAME: "${PRINTER_NAME}"
      PRINTER_ADDRESS: "${PRINTER_ADDRESS}"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      WEBPRINTER_DATA_DIR: "/app/data"
      WEBPRINTER_UPLOAD_TTL_MINUTES: "${WEBPRINTER_UPLOAD_TTL_MINUTES:-60}"
    volumes:
      - webprinter_data:/app/data
    restart: unless-stopped

volumes:
  webprinter_data:
