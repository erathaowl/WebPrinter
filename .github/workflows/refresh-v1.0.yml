name: Refresh v1.0 release

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-v1.0.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Move v1.0 to the verified multi-platform commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0" \
            -f "sha=9c39039866335db4d0910fe4d9cc48749b0490fe" -F force=true

      - name: Rebuild and update v1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref v1.0 --repo "$GITHUB_REPOSITORY"
