name: Retire legacy v1.0

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/retire-v1.0.yml'

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify replacement release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" \
            --jq '.assets[].name' | grep -Fx 'webprinter-1.0.0-py3-none-any.whl'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" \
            --jq '.assets[].name' | grep -Fx 'webprinter-1.0.0.tar.gz'

      - name: Remove obsolete GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0" --jq '.id')
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$old_id"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0"
