name: Build and publish

on:
  pull_request_target:
    branches: [master]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require an approved pull request
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const latest = new Map();
            for (const review of reviews) {
              if (!review.user) continue;
              if (review.state === 'DISMISSED') {
                latest.delete(review.user.login);
              } else if (!['COMMENTED', 'PENDING'].includes(review.state)) {
                latest.set(review.user.login, review.state);
              }
            }
            if (![...latest.values()].includes('APPROVED')) {
              core.setFailed('The merged pull request has no active approval.');
            }

      - name: Checkout merged commit or selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build Python distributions
        run: |
          python -m compileall -q app.py print_backend.py
          uv build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              required = {"app.py", "print_backend.py", "templates/index.html", "static/style.css"}
              missing = required.difference(archive.namelist())
              if missing:
                  raise SystemExit(f"Missing wheel files: {sorted(missing)}")
          PY

      - name: Upload Python package
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  docker:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout merged commit or selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set image name and revision
        id: image
        run: |
          echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ steps.image.outputs.revision }}
            type=raw,value=latest,enable=${{ github.event_name == 'pull_request_target' || github.ref == 'refs/heads/master' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify multi-platform manifest
        run: |
          docker buildx imagetools inspect --raw "${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.revision }}" \
            | jq -e 'any(.manifests[].platform; .os == "linux" and .architecture == "amd64") and any(.manifests[].platform; .os == "linux" and .architecture == "arm64")'
