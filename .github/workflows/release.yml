name: Release

on:
  push:
    tags: ['v*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.number }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y" >&2
            exit 1
          fi
          echo "number=$(echo "$GITHUB_REF_NAME" | cut -c2-)" >> "$GITHUB_OUTPUT"

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set package version from tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          sed -i 's/^version = ".*"$/version = "'"$VERSION"'"/' pyproject.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build Python distributions
        run: |
          python -m compileall -q app.py print_backend.py
          uv build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              required = {"app.py", "print_backend.py", "templates/index.html", "static/style.css"}
              missing = required.difference(archive.namelist())
              if missing:
                  raise SystemExit(f"Missing wheel files: {sorted(missing)}")
          PY

      - name: Upload Python package
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  docker:
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set package version from tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          sed -i 's/^version = ".*"$/version = "'"$VERSION"'"/' pyproject.toml

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=v${{ needs.validate.outputs.version }}
            type=raw,value=${{ needs.validate.outputs.version }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [package, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
