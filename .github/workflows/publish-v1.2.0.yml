name: Publish v1.2.0

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-v1.2.0.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Create tested release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/v1.2.0" -f "sha=91398b814bf808e1b86f90e13631bebc2dcd9368"

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref v1.2.0 --repo "$GITHUB_REPOSITORY"
