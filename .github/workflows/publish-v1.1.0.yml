name: Publish v1.1.0

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-v1.1.0.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Create tested release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/v1.1.0" -f "sha=807ad45c0b4b309f437b14acf81c570252ce6260"

      - name: Dispatch release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref v1.1.0 --repo "$GITHUB_REPOSITORY"
